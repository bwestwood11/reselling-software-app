<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReList – Crosslister</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </div>
    <div class="header-text">
      <p class="brand">ReList</p>
      <p class="subtitle">Crosslister</p>
    </div>
  </div>

  <!-- Unauthenticated state -->
  <div id="login-section">
    <p class="section-label">Sign in to your ReList account</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <p id="login-error" class="error hidden"></p>
      <button type="submit" id="login-btn" class="btn-primary">Sign in</button>
    </form>
  </div>

  <!-- Authenticated state -->
  <div id="status-section" class="hidden">
    <div class="status-card" id="queue-card">
      <div class="status-icon orange">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </div>
      <div>
        <p class="status-title">Queue</p>
        <p class="status-value" id="queue-count">Checking…</p>
      </div>
    </div>

    <div class="status-card" id="job-card">
      <div class="status-icon green">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <p class="status-title">Active job</p>
        <p class="status-value" id="active-job">None</p>
      </div>
    </div>

    <div class="section-divider"></div>

    <!-- Mercari account connection -->
    <p class="section-label">Mercari Account</p>
    <div class="status-card">
      <div class="status-icon" id="mercari-icon" style="background:#fff1f2;color:#e11d48;">
        <span style="font-size:12px;font-weight:800;">M</span>
      </div>
      <div>
        <p class="status-title">Mercari</p>
        <p class="status-value" id="mercari-account">Checking…</p>
      </div>
    </div>
    <button id="mercari-connect-btn" class="btn-primary hidden">Connect Mercari Account</button>
    <p id="mercari-error" class="error hidden" style="margin-top:6px;"></p>

    <div class="section-divider"></div>

    <!-- Poshmark account connection -->
    <p class="section-label">Poshmark Account</p>
    <div class="status-card">
      <div class="status-icon" id="poshmark-icon" style="background:#fff1f2;color:#e11d48;">
        <span style="font-size:12px;font-weight:800;">P</span>
      </div>
      <div>
        <p class="status-title">Poshmark</p>
        <p class="status-value" id="poshmark-account">Checking…</p>
      </div>
    </div>
    <button id="poshmark-connect-btn" class="btn-primary hidden">Connect Poshmark Account</button>
    <p id="poshmark-error" class="error hidden" style="margin-top:6px;"></p>

    <div class="section-divider"></div>

    <p class="hint">
      The extension polls for new crosslisting jobs every 30 seconds and publishes automatically.
    </p>

    <button id="logout-btn" class="btn-secondary">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
